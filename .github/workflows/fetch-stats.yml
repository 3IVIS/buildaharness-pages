name: Fetch GitHub Stats

# Refreshes the live-stats JSON behind four index pages from their curated repo lists:
#
#   repos.txt         -> data.json          AI Agent Frameworks
#   agents-repos.txt  -> agents-data.json   AI Agents
#   mcp-repos.txt     -> mcp-data.json      MCP Servers
#   skills-repos.txt  -> skills-data.json   Agent Skills Libraries
#
# The fetch logic lives in scripts/fetch-stats.mjs. Memory frameworks have their own
# workflow (fetch-memory-stats.yml) because that list carries extra classification columns.

on:
  schedule:
    - cron: '0 2 * * *'   # runs daily at 02:00 UTC
  workflow_dispatch:        # allows manual trigger from the Actions tab
  push:
    paths:
      - 'repos.txt'         # also re-runs whenever a curated list changes
      - 'agents-repos.txt'
      - 'mcp-repos.txt'
      - 'skills-repos.txt'
      - 'scripts/fetch-stats.mjs'

jobs:
  fetch-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # needed to commit the data files back to the repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # How old (in hours) a repo's data can be before we re-fetch it.
          # Set lower (e.g. 1) for more frequent refreshes, higher to spread
          # the load across many runs when the lists are large.
          STALENESS_HOURS: '20'
        run: |
          # One list failing must not stop the others: each run only overwrites its own file, and
          # the script refuses to write an empty result. The commit step below always runs.
          status=0
          node scripts/fetch-stats.mjs repos.txt        data.json         frameworks || status=1
          node scripts/fetch-stats.mjs agents-repos.txt agents-data.json  items      || status=1
          node scripts/fetch-stats.mjs mcp-repos.txt    mcp-data.json     items      || status=1
          node scripts/fetch-stats.mjs skills-repos.txt skills-data.json  items      || status=1
          exit $status

      - name: Commit and push data files
        if: success() || failure()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json agents-data.json mcp-data.json skills-data.json
          if git diff --cached --quiet; then
            echo "No changes to data files — nothing to commit"
          else
            git commit -m "chore: refresh GitHub stats [$(date -u '+%Y-%m-%d %H:%M UTC')]"
            git pull --rebase origin main
            git push
          fi
